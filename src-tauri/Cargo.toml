[package]
name = "atlas"
version = "0.1.0"
description = "Atlas Native Windows File Manager"
authors = ["Atlas Team"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
rayon = "1.10"
open = "5.3"
trash = "5.2"
keyring = { version = "3.6.3", features = ["windows-native"] }
reqwest = { version = "0.13.3", features = ["blocking", "json", "stream"] }
urlencoding = "2.1.3"
base64 = "0.22"
russh = "0.49"
russh-sftp = "2.0"
russh-keys = "0.49"
regex = "1.10"
memmap2 = "0.9"
quick-xml = "0.37"
similar = "2.6"
hex = "0.4"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming"
] }
